spring:
  data:
    mongodb:
      uri: mongodb://root:rootpass@localhost:27017/?authSource=admin
      database: container_booking_db
  application:
    name: maersk-container-booking

jwt:
  secret: "0123456789ABCDEF0123456789ABCDEF"
  expiration-ms: 3600000  # 1 hour



availability:
  external:
    base-url: https://maersk.com
    path: /api/bookings/checkAvailable
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    max-header-size: 6553
    fallback-available: true
    fallback-enabled: true
    retry:
      max-attempts: 3
      backoff-ms: 200

resilience4j:
  custom-circuitbreaker:
    availability-provider:
      sliding-window-type: COUNT_BASED
      sliding-window-size: 5
      minimum-number-of-calls: 5

      failure-rate-threshold: 10
      slow-call-rate-threshold: 50
      slow-call-duration-threshold: 2s

      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 3
      automatic-transition-from-open-to-half-open-enabled: true

      writable-stack-trace-enabled: true
      event-consumer-buffer-size: 200
      record-exceptions:
        - org.springframework.web.reactive.function.client.WebClientRequestException
        - io.netty.handler.codec.http.TooLongHttpHeaderException
        - io.netty.handler.codec.DecoderException
        - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
      ignore-exceptions:
        - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound

  custom-retry:
    availability-provider:
      max-attempts: 3
      wait-duration: 200ms
      retry-exceptions:
        - java.util.concurrent.TimeoutException
        - org.springframework.web.reactive.function.client.WebClientRequestException
        - io.netty.handler.codec.http.TooLongHttpHeaderException
        - io.netty.handler.codec.DecoderException
        - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
      ignore-exceptions:
        - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound


logging:
  level:
    org.springframework.security: DEBUG
