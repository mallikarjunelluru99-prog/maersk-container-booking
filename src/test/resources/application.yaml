spring:
  application:
    name: maersk-container-booking

jwt:
  secret: ReplaceThisWithA256BitSecretKeyReplaceThisWithA256BitSecretKey
  expiration-ms: 3600000  # 1 hour



availability:
  external:
    base-url: https://maersk.com
    path: /api/bookings/checkAvailable
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    max-header-size: 6553
    fallback-available: true
    fallback-enabled: true
    retry:
      max-attempts: 3
      backoff-ms: 200

resilience4j:
  custom-circuitbreaker:
    availability-provider:
      sliding-window-type: COUNT_BASED   # or TIME_BASED
      sliding-window-size: 5          # if TIME_BASED: seconds in the rolling window
      minimum-number-of-calls: 5

      failure-rate-threshold: 10         # percent
      slow-call-rate-threshold: 50       # percent
      slow-call-duration-threshold: 2s   # anything over this is “slow”

      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 3
      automatic-transition-from-open-to-half-open-enabled: true

      writable-stack-trace-enabled: true
      event-consumer-buffer-size: 200

      # Optional: customize which exceptions count as failures
      record-exceptions:
        - org.springframework.web.reactive.function.client.WebClientRequestException
        - io.netty.handler.codec.http.TooLongHttpHeaderException
        - io.netty.handler.codec.DecoderException
        - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
      ignore-exceptions:
        - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound

  custom-retry:
    availability-provider:
      max-attempts: 3
      wait-duration: 200ms
      retry-exceptions:
        - java.util.concurrent.TimeoutException
        - org.springframework.web.reactive.function.client.WebClientRequestException
        - io.netty.handler.codec.http.TooLongHttpHeaderException
        - io.netty.handler.codec.DecoderException
        - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
      ignore-exceptions:
        - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound



logging:
  level:
    org.springframework.security: DEBUG
